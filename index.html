<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องมือวิเคราะห์ Correlation และ Multiple Regression</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f2;--card:#fff;--ink:#1b2622;--mute:#5d6b65;--line:#cfd8d3;--acc:#0d6b5c;--acc-ink:#fff;--head:#e4ece8;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a18;--card:#1c2421;--ink:#e6ede9;--mute:#9db0a8;--line:#34423c;--acc:#3fb6a0;--acc-ink:#0b1512;--head:#26332e;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#141a18;--card:#1c2421;--ink:#e6ede9;--mute:#9db0a8;--line:#34423c;--acc:#3fb6a0;--acc-ink:#0b1512;--head:#26332e;--warn:#ff8a80}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'Sarabun',system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.6rem;margin:.2em 0 .1em}h2{font-size:1.15rem;margin:1.4em 0 .4em}
.sub{color:var(--mute);margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.langs{display:flex;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.modes{display:flex;gap:8px;flex-wrap:wrap}
button,select,input[type=file]{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px}
button:hover{border-color:var(--acc)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700;padding:10px 24px}
button.danger{color:var(--warn)}
button.sm{padding:5px 12px;font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.wrap{overflow-x:auto;max-width:100%}
table.in{border-collapse:collapse;min-width:100%}
table.in th,table.in td{border:1px solid var(--line);padding:0}
table.in th{background:var(--head)}
table.in input{width:100%;min-width:90px;border:0;background:transparent;color:var(--ink);font:inherit;padding:7px 8px}
table.in th input{font-weight:700;text-align:center}
table.in td.n{padding:0 8px;color:var(--mute);text-align:center;width:36px}
.x{border:0;background:none;color:var(--warn);padding:0 6px;font-size:1.1rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#out{background:var(--card);padding:18px;border-radius:8px;border:1px solid var(--line)}
#out h2{margin-top:1.2em}#out h2:first-child{margin-top:0}
table.spss{border-collapse:collapse;margin:6px 0 10px;font-size:.93rem}
table.spss th,table.spss td{border:1px solid var(--line);padding:4px 10px;text-align:right;white-space:nowrap}
table.spss th{background:var(--head);text-align:center}
table.spss td.l{text-align:left}
.blk{margin-bottom:22px}
.cap{font-weight:700;margin-top:12px}
.note{font-size:.85rem;color:var(--mute);margin:0 0 10px}
details.gl{border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin:6px 0 4px;font-size:.88rem;background:color-mix(in srgb,var(--head) 40%,transparent)}
details.gl summary{cursor:pointer;font-weight:600;color:var(--acc)}
details.gl ul{margin:6px 0 4px;padding-left:18px}details.gl li{margin:3px 0}
.eq{background:var(--head);padding:10px 14px;border-radius:6px;font-family:'Sarabun',serif;overflow-x:auto}
.txt p{margin:.4em 0}
.chart{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.chart .bar{justify-content:space-between;margin-top:0}
canvas{max-width:100%;height:auto;display:block;border-radius:4px}
#msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;display:none;z-index:5}
.err{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1 data-i18n="title"></h1><p class="sub" data-i18n="sub"></p></div>
  <div class="langs" role="group" aria-label="Language / ภาษา">
    <button id="lTH" onclick="setLang('th')">ไทย</button>
    <button id="lEN" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="card">
  <b data-i18n="s1"></b>
  <div class="modes" style="margin-top:8px">
    <button id="mC" class="on" onclick="setMode('corr')" data-i18n="mC"></button>
    <button id="mR" onclick="setMode('reg')" data-i18n="mR"></button>
  </div>
  <div id="cmBox" style="margin-top:12px">
    <div class="bar" style="margin:0 0 4px"><span data-i18n="cmLbl"></span>
      <button id="cmP" class="on" onclick="setCM('pearson')">Pearson Correlation (r)</button>
      <button id="cmS" onclick="setCM('spearman')">Spearman Rank Correlation (rho)</button>
      <button id="cmK" onclick="setCM('kendall')">Kendall's Tau</button>
    </div>
    <p class="note" id="cmHint" style="margin:0"></p>
  </div>
  <div id="depBox" class="bar" style="display:none">
    <label for="dep" data-i18n="dep"></label><select id="dep"></select>
    <span style="color:var(--mute)" data-i18n="depHint"></span>
  </div>
</div>

<div class="card">
  <b data-i18n="s2"></b> <span style="color:var(--mute)" data-i18n="s2hint"></span>
  <div class="bar">
    <button onclick="addCol()" data-i18n="addCol"></button>
    <button onclick="addRow()" data-i18n="addRow"></button>
    <button onclick="loadSample()" data-i18n="sample"></button>
    <label><span data-i18n="fileLbl"></span> <input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
  </div>
  <div class="wrap"><table class="in" id="tbl"></table></div>
  <div class="bar" style="margin-top:14px">
    <button class="go" onclick="run()" data-i18n="run"></button>
    <button class="danger" onclick="resetAll()" data-i18n="reset"></button>
  </div>
  <p class="note" style="margin:0" data-i18n="pasteNote"></p>
</div>

<div id="res" style="display:none">
  <div class="tabs">
    <button id="vT" class="on" onclick="setView('table')" data-i18n="viewT"></button>
    <button id="vC" onclick="setView('chart')" data-i18n="viewC"></button>
  </div>
  <div id="tableView">
    <div class="bar">
      <button onclick="saveXLSX()" data-i18n="dlX"></button>
      <button onclick="saveDOC()" data-i18n="dlW"></button>
    </div>
    <div id="out"></div>
  </div>
  <div id="chartView" style="display:none"></div>
</div>
</main>
<div id="msg" role="status"></div>

<script>
let lang='th',mode='corr',cm='pearson',view='table',cols=[],rows=[],last=null;
const SY={pearson:['r','Pearson r'],spearman:['ρ','Spearman rho'],kendall:['τ','Kendall tau-b']};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('msg');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}

/* ================= i18n ================= */
const L={
th:{
 title:'วิเคราะห์ Correlation และ Multiple Regression',
 sub:'กรอกข้อมูลตัวเลขหรือแนบไฟล์ Excel แล้วกดประมวลผล ผลลัพธ์แสดงในรูปแบบคล้าย SPSS',
 s1:'1. เลือกวิธีการวิเคราะห์',mC:'Correlation',mR:'Multiple Regression',
 dep:'ตัวแปรตาม (Y):',depHint:'ตัวแปรที่เหลือทั้งหมดเป็นตัวแปรอิสระ',
 s2:'2. ใส่ข้อมูล',s2hint:'(พิมพ์ชื่อตัวแปรที่หัวคอลัมน์ได้)',
 addCol:'+ เพิ่มตัวแปร',addRow:'+ เพิ่มแถว',sample:'ใส่ตัวอย่างข้อมูล',fileLbl:'หรือแนบไฟล์ Excel / CSV:',
 run:'ประมวลผล',reset:'Reset ข้อมูล',

 viewT:'แสดงผลเป็นตาราง',viewC:'แสดงผลเป็นกราฟ',dlX:'ดาวน์โหลดตารางเป็นไฟล์ Excel',dlW:'บันทึกเป็นไฟล์ Word',dlPng:'ดาวน์โหลด PNG',
 glTitle:'คำอธิบายค่าสถิติ',
 hCorr:'ผลการวิเคราะห์ Correlation (Pearson)',hReg:'ผลการวิเคราะห์ Multiple Regression',
 hExp:'การอธิบายผลการวิเคราะห์',hEqs:'สมการทำนาย',eqRaw:'สมการคะแนนดิบ:',eqStd:'สมการคะแนนมาตรฐาน:',
 vr:'ตัวแปร',delVar:'ลบตัวแปร',aVar:j=>`ชื่อตัวแปรที่ ${j}`,aCell:(i,j)=>`แถว ${i} คอลัมน์ ${j}`,
 tMin3:'ต้องมีข้อมูลที่ครบทุกตัวแปรอย่างน้อย 3 แถว',tSD0:'มีตัวแปรที่ค่าเท่ากันทุกแถว (SD = 0) ไม่สามารถวิเคราะห์ได้',

 tImport:(r,c)=>`นำเข้า ${r} แถว ${c} ตัวแปร`,tWait:'กำลังสร้างไฟล์...',tSaved:'บันทึกแล้ว',tFail:'สร้างไฟล์ไม่สำเร็จ',
 errN:n=>`จำนวนแถวต้องมากกว่าจำนวนตัวแปรอิสระ + 1 (ตอนนี้มี ${n} แถว)`,errCol:'ตัวแปรอิสระมีความสัมพันธ์กันเองสมบูรณ์ (multicollinearity) หรือข้อมูลไม่พอ',
 sampleCols:['ชั่วโมงอ่านหนังสือ','ชั่วโมงนอน','การเข้าเรียน (%)','คะแนนสอบ'],
 lv5:['สูงมาก','สูง','ปานกลาง','ต่ำ','ต่ำมาก'],sigY:'มีนัยสำคัญ',sigN:'ไม่มีนัยสำคัญ',outl:'ค่าผิดปกติ',
 starNote:'** Correlation is significant at the 0.01 level (2-tailed). * Correlation is significant at the 0.05 level (2-tailed).',
 corrIntro:(n,k,p)=>`วิเคราะห์ด้วยสหสัมพันธ์เพียร์สัน (Pearson) จากข้อมูล ${n} ชุด ตัวแปร ${k} ตัว (${p} คู่) ที่ระดับนัยสำคัญ .05 และรายงาน Spearman rho เป็นข้อมูลประกอบ`,
 corrSigN:n=>`พบคู่ตัวแปรที่มีความสัมพันธ์อย่างมีนัยสำคัญทางสถิติ ${n} คู่ ดังนี้`,
 corrNone:'ไม่พบคู่ตัวแปรที่มีความสัมพันธ์อย่างมีนัยสำคัญทางสถิติ',
 corrPair:(a,b,r,lv,rs,ps,pct)=>`• <b>${a}</b> กับ <b>${b}</b> มีความสัมพันธ์ทิศทาง${r>0?'บวก (เพิ่มขึ้นไปด้วยกัน)':'ลบ (ผกผันกัน)'} ระดับ${lv} (r = ${rs}, p = ${ps}) อธิบายความแปรปรวนซึ่งกันและกันได้ ${pct}%`,
 corrCrit:'เกณฑ์การแปลผลขนาดความสัมพันธ์ (|r|): ≥ .80 สูงมาก, .60–.79 สูง, .40–.59 ปานกลาง, .20–.39 ต่ำ, &lt; .20 ต่ำมาก ค่า r เป็นเพียงความสัมพันธ์ ไม่ได้บอกความเป็นเหตุเป็นผล และกลุ่มตัวอย่างเล็กอาจทำให้ผลไม่เสถียร',
 eqNote:'สมการได้จาก b = r × (SD<sub>Y</sub> / SD<sub>X</sub>) และ a = Ȳ − bX̄ ใช้ทำนายตัวแปรหลังเครื่องหมาย = จากตัวแปรในวงเล็บ',
 regModel:(k,Y,sg,F,d,p)=>`• <b>ภาพรวมของโมเดล:</b> ตัวแปรอิสระ ${k} ตัวร่วมกันทำนาย ${Y} ได้${sg?'อย่างมีนัยสำคัญทางสถิติ':'ไม่มีนัยสำคัญทางสถิติ'} (F(${k}, ${d}) = ${F}, p = ${p})`,
 regR:(Y,R,lv,R2,pct,adj)=>`• <b>R = ${R}</b> บอกความสัมพันธ์ระหว่างค่าจริงกับค่าทำนาย ระดับ${lv} <b>R² = ${R2}</b> หมายความว่าตัวแปรอิสระอธิบายความแปรปรวนของ ${Y} ได้ ${pct}% และค่า Adjusted R² = ${adj} (ปรับตามจำนวนตัวแปรและขนาดตัวอย่างแล้ว)`,
 regVar:(x,Y,pos,bs,ps,ba)=>`${x} มีผลทาง${pos?'บวก':'ลบ'}ต่อ ${Y} อย่างมีนัยสำคัญ (B = ${bs}, p = ${ps}) คือเมื่อ ${x} เพิ่มขึ้น 1 หน่วย ${Y} จะ${pos?'เพิ่มขึ้น':'ลดลง'} ${ba} หน่วย โดยควบคุมตัวแปรอื่นคงที่`,
 regVarH:'• <b>รายตัวแปร:</b> ',regNoVar:'ไม่มีตัวแปรอิสระตัวใดที่มีนัยสำคัญทางสถิติที่ระดับ .05',
 regTop:(x,b)=>`• ตัวแปรที่มีอิทธิพลสัมพัทธ์สูงสุดโดยดูจาก |Beta| คือ <b>${x}</b> (Beta = ${b})`,
 regVifBad:'พบ VIF มากกว่า 10 แสดงว่าตัวแปรอิสระสัมพันธ์กันเองสูง ควรพิจารณาตัดตัวแปรบางตัว',regVifOk:'ค่า VIF ทุกตัวไม่เกิน 10 ไม่พบปัญหา multicollinearity ที่รุนแรง',
 regDW:(d,ok)=>`• <b>Durbin-Watson = ${d}:</b> ${ok?'อยู่ในช่วง 1.5–2.5 ไม่พบ autocorrelation ของค่าคลาดเคลื่อนที่เด่นชัด':'อยู่นอกช่วง 1.5–2.5 อาจมี autocorrelation (ค่านี้มีความหมายเมื่อข้อมูลเรียงตามลำดับเวลา)'}`,
 regOut:(n)=>`• <b>ค่าผิดปกติ:</b> พบ ${n} แถวที่ |Std. Residual| > 3 ควรตรวจสอบ (ดูตาราง Casewise Diagnostics)`,
 regSmall:(n,k)=>`ข้อสังเกต: ตัวอย่าง ${n} ชุดค่อนข้างน้อยเมื่อเทียบกับจำนวนตัวแปร (แนะนำอย่างน้อย 10–20 ชุดต่อตัวแปรอิสระ) ผลอาจไม่เสถียร`,
 cHeat:'Heat Map ของ Correlation Matrix',cSplom:'Scatterplot Matrix',cPairs:'ค่า r รายคู่ พร้อมช่วงความเชื่อมั่น 95%',cObs:'Multiple Regression: ค่าจริง เทียบ ค่าทำนาย',cRes:'Residual Plot: Std. Residual เทียบ ค่าทำนาย',cQQ:'Normal Q-Q Plot ของ Std. Residual',cHist:'Histogram ของ Std. Residual',cBeta:'Standardized Coefficients (Beta)',
 hHeat:'สีแดง = สัมพันธ์ทางบวก สีน้ำเงิน = สัมพันธ์ทางลบ ยิ่งเข้มยิ่งสัมพันธ์แรง',
 hSplom:'เส้นทแยงมุมคือฮิสโตแกรมของแต่ละตัวแปร ช่องอื่นคือแผนภาพการกระจาย (แกน X = ตัวแปรของคอลัมน์, แกน Y = ตัวแปรของแถว) พร้อมเส้นถดถอยและค่า r',
 hPairs:'แท่ง = ค่า r, เส้นขีด = ช่วงความเชื่อมั่น 95% (Fisher z) สีเขียว = มีนัยสำคัญที่ .05 สีเทา = ไม่มีนัยสำคัญ',
 hObs:'จุดยิ่งใกล้เส้นทแยงมุมยิ่งแสดงว่าทำนายได้แม่น',
 hRes:'ควรกระจายสุ่มรอบเส้น 0 ไม่เป็นรูปกรวยหรือเป็นโค้ง (ตรวจความเท่ากันของความแปรปรวนและความเป็นเส้นตรง) เส้นประ = ±2',

 aPred:Y=>`ค่าทำนาย (Predicted ${Y})`,aObs:Y=>`ค่าจริง (Observed ${Y})`,aTheo:'ควอนไทล์ตามทฤษฎี (Normal)',aZres:'Std. Residual',aFreq:'จำนวน (Frequency)',aR:'Pearson r',aBeta:'Standardized Beta'
},
en:{
 title:'Correlation & Multiple Regression Analysis',

/* ================= data table ================= */
const nmx=(c,j)=>c||t('vr')+' '+(j+1);
function init(){cols=['X1','X2','Y'];rows=Array.from({length:5},()=>cols.map(()=>''));render()}
function render(){
  let h='<tr><th class="n"></th>'+cols.map((c,j)=>`<th><div style="display:flex;align-items:center"><input value="${esc(c)}" aria-label="${esc(t('aVar',j+1))}" oninput="cols[${j}]=this.value;fillDep()">${cols.length>2?`<button class="x" title="${esc(t('delVar'))}" onclick="delCol(${j})">×</button>`:''}</div></th>`).join('')+'</tr>';
  rows.forEach((r,i)=>{h+=`<tr><td class="n">${i+1}</td>`+r.map((v,j)=>`<td><input inputmode="decimal" value="${esc(v)}" aria-label="${esc(t('aCell',i+1,j+1))}" oninput="rows[${i}][${j}]=this.value"></td>`).join('')+'</tr>'});
  $('tbl').innerHTML=h;fillDep();
}
function fillDep(){const s=$('dep'),cur=s.value;s.innerHTML=cols.map((c,j)=>`<option value="${j}">${esc(nmx(c,j))}</option>`).join('');s.value=cur!==''&&+cur<cols.length?cur:cols.length-1}
function addCol(){cols.push('X'+(cols.length+1));rows.forEach(r=>r.push(''));render()}
function delCol(j){cols.splice(j,1);rows.forEach(r=>r.splice(j,1));render()}
function addRow(){rows.push(cols.map(()=>''));render();const w=document.querySelector('.wrap');w.scrollTop=w.scrollHeight}
function resetAll(){init();last=null;$('res').style.display='none';$('out').innerHTML='';$('chartView').innerHTML='';$('file').value='';toast(t('tReset'))}
function setMode(m){mode=m;$('mC').classList.toggle('on',m=='corr');$('mR').classList.toggle('on',m=='reg');$('depBox').style.display=m=='reg'?'flex':'none';$('cmBox').style.display=m=='corr'?'block':'none'}
function setCM(m){cm=m;updCM()}
function updCM(){[['cmP','pearson'],['cmS','spearman'],['cmK','kendall']].forEach(([id,v])=>$(id).classList.toggle('on',cm==v));$('cmHint').innerHTML=t('cmHint'+cm)}
function setView(v){view=v;$('vT').classList.toggle('on',v=='table');$('vC').classList.toggle('on',v=='chart');$('tableView').style.display=v=='table'?'block':'none';$('chartView').style.display=v=='chart'?'block':'none'}
function setLang(l){lang=l;document.documentElement.lang=l;$('lTH').classList.toggle('on',l=='th');$('lEN').classList.toggle('on',l=='en');document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.innerHTML=t(e.dataset.i18n));updCM();render();if(last)build()}

function loadSample(){
  let s=20240611;const rnd=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
  const gs=()=>{const u=rnd()||1e-9,v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  cols=t('sampleCols').slice();rows=[];
  for(let i=0;i<30;i++){
    const st=cl(5+2*gs(),0.5,10),sl=cl(6.5+gs(),4,9),at=cl(80+9*gs()+1.5*(st-5),50,100),sc=cl(30+4*st+2.5*sl+.2*at+4*gs(),0,100);
    rows.push([st,sl,at,sc].map(v=>v.toFixed(1)));
  }
  render();$('dep').value=cols.length-1;toast(t('tSample'));
}
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=ev=>{try{
    const wb=XLSX.read(ev.target.result,{type:'array'});
    const a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    if(a.length<2||a[0].length<2)throw 0;
    cols=a[0].map((c,j)=>String(c||'V'+(j+1)));
    rows=a.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>cols.map((_,j)=>r[j]===undefined?'':String(r[j])));
    render();toast(t('tImport',rows.length,cols.length));
  }catch(x){toast(t('tFile'))}};
  rd.readAsArrayBuffer(f);
});

/* ================= statistics ================= */
const sum=a=>a.reduce((s,v)=>s+v,0),mean=a=>sum(a)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(sum(a.map(v=>(v-m)**2))/(a.length-1))};
const cov=(x,y)=>{const mx=mean(x),my=mean(y);return sum(x.map((v,i)=>(v-mx)*(y[i]-my)))/(x.length-1)};
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function skew(a){const n=a.length;if(n<3)return NaN;const m=mean(a),s=sd(a);return n/((n-1)*(n-2))*sum(a.map(v=>((v-m)/s)**3))}
function kurt(a){const n=a.length;if(n<4)return NaN;const m=mean(a),s=sd(a);return n*(n+1)/((n-1)*(n-2)*(n-3))*sum(a.map(v=>((v-m)/s)**4))-3*(n-1)**2/((n-2)*(n-3))}
const seSk=n=>Math.sqrt(6*n*(n-1)/((n-2)*(n+1)*(n+3)));
const seKu=n=>2*seSk(n)*Math.sqrt((n*n-1)/((n-3)*(n+5)));
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const v of c)s+=v/++y;return -t+Math.log(2.5066282746310005*s/x)}
function bcf(x,a,b){const T=1e-30;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<T)d=T;d=1/d;let h=d;
  for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h}
function ib(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(x,a,b)/a:1-bt*bcf(1-x,b,a)/b}
const pT=(tv,df)=>isFinite(tv)?ib(df/(df+tv*tv),df/2,.5):0;
const pF=(F,d1,d2)=>isFinite(F)?ib(d2/(d2+d1*F),d2/2,d1/2):0;
function tinv(df,alpha=.05){let lo=0,hi=1000;for(let i=0;i<80;i++){const m=(lo+hi)/2;pT(m,df)>alpha?lo=m:hi=m}return(lo+hi)/2}

function descBlk(C,n,names,m='pearson'){
  const tc=tinv(n-1);
  const S=C.map(c=>{const mu=mean(c),s=sd(c),se=s/Math.sqrt(n),mn=Math.min(...c),mx=Math.max(...c),q1=quant(c,.25),q3=quant(c,.75);

  const defs=[['N','N',0],['Mean','Mean'],['Std. Error of Mean','se'],['95% CI of Mean: Lower Bound','lo'],['95% CI of Mean: Upper Bound','hi'],['Median','med'],['Std. Deviation','s'],['Variance','v'],['Minimum','mn'],['Maximum','mx'],['Range','rg'],['Skewness','sk'],['Std. Error of Skewness','ssk'],['Kurtosis','ku'],['Std. Error of Kurtosis','sku']];
  if(m!='pearson')defs.splice(6,0,['25th Percentile (Q1)','q1'],['75th Percentile (Q3)','q3'],['Interquartile Range (IQR)','iqr']);
  const inner=`<tr><th>Statistic</th>${names.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>`+defs.map(([lb,key,d])=>`<tr><td class="l">${lb}</td>${S.map(o=>`<td>${f3(o[key],d??3)}</td>`).join('')}</tr>`).join('');

function corrBlk(C,n,names,m='pearson'){

    inner+=`<tr><td class="l" rowspan="${rs}">${esc(c)}</td><td class="l">${lab}</td>${R[i].map((v,j)=>`<td>${i==j?'1':fr(v)+star(P[i][j])}</td>`).join('')}</tr>`;

    if(pe)inner+=`<tr><td class="l">Covariance</td>${C.map(b=>`<td>${f3(cov(C[i],b))}</td>`).join('')}</tr>`;

function run(){
  const data=[];
  rows.forEach(r=>{const v=r.map(x=>x===''?NaN:Number(String(x).replace(/,/g,'')));if(v.every(isFinite))data.push(v)});
  const k=cols.length,n=data.length;
  if(n<3)return toast(t('tMin3'));
  const C=cols.map((_,j)=>data.map(r=>r[j]));
  if(C.some(c=>sd(c)==0))return toast(t('tSD0'));
  last={C,n,names:cols.map((c,j)=>c||t('vr')+' '+(j+1)),mode,cm,dj:+$('dep').value,data};
  if(!build())return;
  $('res').style.display='block';$('res').scrollIntoView({behavior:'smooth'});
}

const hTitle=()=>last.mode=='corr'?t('hCorr'+last.cm):t('hReg');
function regOut(C,n,dj,names){
  const xs=C.map((_,j)=>j).filter(j=>j!=dj),k=xs.length,p=k+1,y=C[dj];
  if(n<=p)return{err:t('errN',n)};
  const A=y.map((_,m)=>[1,...xs.map(j=>C[j][m])]);
  const XtX=Array.from({length:p},(_,i)=>Array.from({length:p},(_,j)=>sum(A.map(r=>r[i]*r[j]))));
  const Xty=Array.from({length:p},(_,i)=>sum(A.map((r,m)=>r[i]*y[m])));
  const iv=inv(XtX);if(!iv)return{err:t('errCol')};
  const b=iv.map(r=>sum(r.map((v,j)=>v*Xty[j])));
  const yh=A.map(r=>sum(r.map((v,j)=>v*b[j]))),e=y.map((v,i)=>v-yh[i]);
  const my=mean(y),sse=sum(e.map(v=>v*v)),sst=sum(y.map(v=>(v-my)**2)),ssr=sst-sse;
  const dfe=n-p,mse=sse/dfe,msr=ssr/k,F=msr/mse,sigF=pF(F,k,dfe);
  const R2=ssr/sst,adj=1-(1-R2)*(n-1)/dfe,se=Math.sqrt(mse),Rm=Math.sqrt(Math.max(0,R2));
  let dwn=0;for(let i=1;i<n;i++)dwn+=(e[i]-e[i-1])**2;const dw=dwn/sse;
  const zr=e.map(v=>v/se);
  const Rx=xs.map(a=>xs.map(c=>a==c?1:pearson(C[a],C[c]))),Ri=k>1?inv(Rx):[[1]],tc=tinv(dfe);
  const co=b.map((bv,i)=>{const s=Math.sqrt(mse*iv[i][i]),tv=bv/s,x=i?C[xs[i-1]]:null,vif=i&&Ri?Ri[i-1][i-1]:NaN;
    return{b:bv,s,tv,p:pT(tv,dfe),lo:bv-tc*s,hi:bv+tc*s,beta:i?bv*sd(x)/sd(y):NaN,vif,tol:i?1/vif:NaN,zero:i?pearson(x,y):NaN,par:i?tv/Math.sqrt(tv*tv+dfe):NaN,part:i?tv*Math.sqrt((1-R2)/dfe):NaN}});
  const Yr=names[dj],Y=esc(Yr),xn=xs.map(j=>names[j]);
  let h='';
  h+=blk('Variables Entered/Removed',`<tr><th>Model</th><th>Variables Entered</th><th>Method</th><th>Dependent Variable</th></tr><tr><td class="l">1</td><td class="l">${xn.map(esc).join(', ')}</td><td class="l">Enter</td><td class="l">${Y}</td></tr>`,['vent']);
  h+=blk('Model Summary',`<tr><th>R</th><th>R Square</th><th>Adjusted R Square</th><th>Std. Error of the Estimate</th><th>Durbin-Watson</th><th>N</th></tr><tr><td>${f3(Rm)}</td><td>${f3(R2)}</td><td>${f3(adj)}</td><td>${f3(se)}</td><td>${f3(dw)}</td><td>${n}</td></tr>`,['R','R2m','adj','seest','dw'],`Predictors: (Constant), ${xn.map(esc).join(', ')}. Dependent Variable: ${Y}`);
  h+=blk('ANOVA',`<tr><th>Model</th><th>Sum of Squares</th><th>df</th><th>Mean Square</th><th>F</th><th>Sig.</th></tr>
  <tr><td class="l">Regression</td><td>${f3(ssr)}</td><td>${k}</td><td>${f3(msr)}</td><td>${f3(F)}</td><td>${fp(sigF)}</td></tr>
  <tr><td class="l">Residual</td><td>${f3(sse)}</td><td>${dfe}</td><td>${f3(mse)}</td><td></td><td></td></tr>
  <tr><td class="l">Total</td><td>${f3(sst)}</td><td>${n-1}</td><td></td><td></td><td></td></tr>`,['ss','df','ms','F','sigF'],`Dependent Variable: ${Y}`);
  h+=blk('Coefficients',`<tr><th rowspan="2"></th><th colspan="2">Unstandardized Coefficients</th><th>Standardized Coefficients</th><th rowspan="2">t</th><th rowspan="2">Sig.</th><th colspan="2">95% CI for B</th><th colspan="3">Correlations</th><th colspan="2">Collinearity Statistics</th></tr>
  <tr><th>B</th><th>Std. Error</th><th>Beta</th><th>Lower Bound</th><th>Upper Bound</th><th>Zero-order</th><th>Partial</th><th>Part</th><th>Tolerance</th><th>VIF</th></tr>`+
  co.map((r,i)=>`<tr><td class="l">${i?esc(names[xs[i-1]]):'(Constant)'}</td><td>${f3(r.b)}</td><td>${f3(r.s)}</td><td>${i?fr(r.beta):''}</td><td>${f3(r.tv)}</td><td>${fp(r.p)}</td><td>${f3(r.lo)}</td><td>${f3(r.hi)}</td><td>${i?fr(r.zero):''}</td><td>${i?fr(r.par):''}</td><td>${i?fr(r.part):''}</td><td>${i?f3(r.tol):''}</td><td>${i?f3(r.vif,2):''}</td></tr>`).join(''),
  ['B','seB','beta','tv','sigt','ciB','zero','partial','part','tol','vif'],`Dependent Variable: ${Y}`);
  const rs=(lb,a)=>{const mn=Math.min(...a),mx=Math.max(...a),m=mean(a),s=sd(a);return `<tr><td class="l">${lb}</td><td>${f3(mn)}</td><td>${f3(mx)}</td><td>${f3(m)}</td><td>${f3(s)}</td><td>${n}</td></tr>`};
  const sdh=sd(yh),zp=yh.map(v=>(v-mean(yh))/sdh);
  h+=blk('Residuals Statistics',`<tr><th></th><th>Minimum</th><th>Maximum</th><th>Mean</th><th>Std. Deviation</th><th>N</th></tr>${rs('Predicted Value',yh)}${rs('Residual',e)}${rs('Std. Predicted Value',zp)}${rs('Std. Residual',zr)}`,['pred','resid','zpred','zres'],`Dependent Variable: ${Y}`);
  const nOut=zr.filter(v=>Math.abs(v)>3).length;
  h+=blk('Casewise Diagnostics',`<tr><th>Case Number</th><th>Observed ${Y}</th><th>Predicted Value</th><th>Residual</th><th>Std. Residual</th><th>Flag</th></tr>`+y.map((v,i)=>`<tr><td>${i+1}</td><td>${f3(v)}</td><td>${f3(yh[i])}</td><td>${f3(e[i])}</td><td>${f3(zr[i])}</td><td class="l">${Math.abs(zr[i])>3?t('outl'):''}</td></tr>`).join(''),['obs','zres']);
  const eqPlain=`${Yr}̂ = ${f3(b[0])}`+xs.map((j,i)=>` ${sgn(b[i+1])} ${f3(Math.abs(b[i+1]))}(${names[j]})`).join('');
  const zPlain=`Z${Yr}̂ = `+xs.map((j,i)=>{const bt=co[i+1].beta;return(i?(bt<0?' − ':' + '):(bt<0?'−':''))+f3(Math.abs(bt))+`(Z${names[j]})`}).join('');
  h+=`<h2>${t('hEqs')}</h2><div class="eq"><b>${t('eqRaw')}</b> ${esc(eqPlain)}<br><b>${t('eqStd')}</b> ${esc(zPlain)}</div>`;
  const sigs=co.slice(1).map(r=>r.p<.05),betas=co.slice(1).map(r=>r.beta);
  const sigL=xs.map((j,i)=>({j,r:co[i+1]})).filter(o=>o.r.p<.05);
  const top=xs.map((j,i)=>({j,r:co[i+1]})).sort((a,c)=>Math.abs(c.r.beta)-Math.abs(a.r.beta))[0];
  h+=`<h2>${t('hExp')}</h2><div class="txt">
  <p>${t('regModel',k,Y,sigF<.05,f3(F,2),dfe,fp(sigF))}</p>
  <p>${t('regR',Y,f3(Rm),lvl(Rm),f3(R2),f3(R2*100,1),f3(adj))}</p>
  <p>${t('regVarH')}${sigL.length?sigL.map(o=>t('regVar',esc(names[o.j]),Y,o.r.b>0,f3(o.r.b),fp(o.r.p),f3(Math.abs(o.r.b)))).join('; '):t('regNoVar')}</p>
  <p>${t('regTop',esc(names[top.j]),fr(top.r.beta))}</p>
  <p>• <b>Multicollinearity:</b> ${co.slice(1).some(r=>r.vif>10)?`<span class="err">${t('regVifBad')}</span>`:t('regVifOk')}</p>
  <p>${t('regDW',f3(dw),dw>=1.5&&dw<=2.5)}</p>
  ${nOut?`<p>${t('regOut',nOut)}</p>`:''}
  ${n<10*k?`<p class="err">${t('regSmall',n,k)}</p>`:''}</div>`;
  return{html:h,y,yh,zr,eqPlain,R2,Y:Yr,xn,betas,sigs};
}

/* ================= charts ================= */
const INK='#1b2622',MUTE='#5d6b65',GRID='#d9e0dc',ACC='#0d6b5c',RED='#c0392b',GREY='#9aa7a1',F14='14px Sarabun,sans-serif',F12='12px Sarabun,sans-serif';
function mk(id,W,H){const cv=$(id),d=2;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height='auto';cv.style.maxWidth='100%';const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.font=F14;c.fillStyle=INK;return c}
function trim(c,s,w){if(c.measureText(s).width<=w)return s;while(s.length>1&&c.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
const tf=v=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);
function frame(c,W,title,sub){let fs=15;c.font=`700 ${fs}px Sarabun,sans-serif`;while(c.measureText(title).width>W-24&&fs>9){fs--;c.font=`700 ${fs}px Sarabun,sans-serif`}
  c.fillStyle=INK;c.textAlign='center';c.fillText(title,W/2,22);if(sub){c.font="13px Sarabun,sans-serif";c.fillStyle=MUTE;c.fillText(sub,W/2,44)}c.font=F14}
function heatCol(v){const q=Math.max(-1,Math.min(1,v)),a=q<0?[44,110,190]:[205,70,55],m=Math.abs(q);return`rgb(${Math.round(255+(a[0]-255)*m)},${Math.round(255+(a[1]-255)*m)},${Math.round(255+(a[2]-255)*m)})`}
function drawHeat(id,names,R){
  const k=names.length,cell=Math.max(56,Math.min(90,520/k)),Lm=140,T=20,B=80,W=Lm+k*cell+90,H=T+k*cell+B,c=mk(id,W,H);c.textBaseline='middle';
  R.forEach((row,i)=>{c.fillStyle=INK;c.textAlign='right';c.fillText(trim(c,names[i],Lm-14),Lm-8,T+i*cell+cell/2);
    row.forEach((v,j)=>{c.fillStyle=heatCol(v);c.fillRect(Lm+j*cell,T+i*cell,cell-2,cell-2);c.fillStyle=Math.abs(v)>.6?'#fff':'#111';c.textAlign='center';c.fillText(i==j?'1':fr(v),Lm+j*cell+cell/2-1,T+i*cell+cell/2-1)})});
  names.forEach((n,j)=>{c.save();c.translate(Lm+j*cell+cell/2,T+k*cell+8);c.rotate(Math.PI/6);c.fillStyle=INK;c.textAlign='left';c.fillText(trim(c,n,80),0,8);c.restore()});
  const g=c.createLinearGradient(0,T,0,T+k*cell);g.addColorStop(0,heatCol(1));g.addColorStop(.5,heatCol(0));g.addColorStop(1,heatCol(-1));
  const gx=Lm+k*cell+20;c.fillStyle=g;c.fillRect(gx,T,16,k*cell-2);c.fillStyle=INK;c.textAlign='left';c.fillText('+1',gx+22,T+8);c.fillText('0',gx+22,T+k*cell/2);c.fillText('−1',gx+22,T+k*cell-10);
}
function plotXY(id,W,H,xs,ys,o){
  const c=mk(id,W,H),Lm=70,Rm=24,T=o.sub?62:44,B=60,pw=W-Lm-Rm,ph=H-T-B;
  let a=Math.min(...xs),b=Math.max(...xs),e=Math.min(...ys),f=Math.max(...ys);
  if(o.diag){a=e=Math.min(a,e);b=f=Math.max(b,f)}
  if(o.hz){e=Math.min(e,...o.hz);f=Math.max(f,...o.hz)}
  const px=(b-a)*.06||1,py=(f-e)*.06||1;a-=px;b+=px;e-=py;f+=py;
  const X=v=>Lm+(v-a)/(b-a)*pw,Y=v=>T+ph-(v-e)/(f-e)*ph;
  frame(c,W,o.title,o.sub);
  c.strokeStyle=GRID;c.lineWidth=1;c.font=F12;c.fillStyle=MUTE;
  for(let i=0;i<=5;i++){const vx=a+(b-a)*i/5,vy=e+(f-e)*i/5;
    c.beginPath();c.moveTo(Lm,Y(vy));c.lineTo(W-Rm,Y(vy));c.stroke();c.beginPath();c.moveTo(X(vx),T);c.lineTo(X(vx),T+ph);c.stroke();
    c.textAlign='right';c.fillText(tf(vy),Lm-6,Y(vy)+4);c.textAlign='center';c.fillText(tf(vx),X(vx),T+ph+16)}
  c.strokeStyle=INK;c.strokeRect(Lm,T,pw,ph);
  if(o.diag){c.strokeStyle=ACC;c.lineWidth=2;c.beginPath();c.moveTo(X(a),Y(a));c.lineTo(X(b),Y(b));c.stroke()}
  (o.hz||[]).forEach(v=>{c.strokeStyle=v==0?INK:GREY;c.lineWidth=v==0?1.5:1;c.setLineDash(v==0?[]:[6,4]);c.beginPath();c.moveTo(Lm,Y(v));c.lineTo(W-Rm,Y(v));c.stroke()});c.setLineDash([]);
  c.fillStyle='rgba(192,57,43,.75)';xs.forEach((v,i)=>{c.beginPath();c.arc(X(v),Y(ys[i]),4.5,0,7);c.fill()});
  c.fillStyle=INK;c.font=F14;c.textAlign='center';c.fillText(o.xl,Lm+pw/2,H-12);
  c.save();c.translate(16,T+ph/2);c.rotate(-Math.PI/2);c.fillText(o.yl,0,0);c.restore();
}
function bins(a,nb){const lo=Math.min(...a),hi=Math.max(...a),w=(hi-lo)/nb||1,cnt=Array(nb).fill(0);a.forEach(v=>{cnt[Math.min(nb-1,Math.floor((v-lo)/w))]++});return{lo,w,cnt}}
function histChart(id,W,H,a,title){
  const n=a.length,nb=Math.max(5,Math.ceil(Math.log2(n)+1)),{lo,w,cnt}=bins(a,nb),m=mean(a),s=sd(a),pk=n*w/(s*Math.sqrt(2*Math.PI));
  const c=mk(id,W,H),Lm=64,Rm=24,T=44,B=58,pw=W-Lm-Rm,ph=H-T-B,ymax=Math.max(Math.max(...cnt),pk)*1.15;
  const X=v=>Lm+(v-lo)/(w*nb)*pw,Y=v=>T+ph-v/ymax*ph;
  frame(c,W,title);c.font=F12;c.fillStyle=MUTE;c.strokeStyle=GRID;
  for(let i=0;i<=5;i++){const v=ymax*i/5;c.beginPath();c.moveTo(Lm,Y(v));c.lineTo(W-Rm,Y(v));c.stroke();c.textAlign='right';c.fillText(v.toFixed(ymax<10?1:0),Lm-6,Y(v)+4)}
  cnt.forEach((v,i)=>{c.fillStyle='rgba(13,107,92,.6)';c.fillRect(X(lo+i*w),Y(v),pw/nb-1,T+ph-Y(v));c.strokeStyle=ACC;c.strokeRect(X(lo+i*w),Y(v),pw/nb-1,T+ph-Y(v))});
  c.fillStyle=MUTE;c.textAlign='center';for(let i=0;i<=nb;i+=Math.ceil(nb/6))c.fillText(tf(lo+i*w),X(lo+i*w),T+ph+16);
  c.strokeStyle=RED;c.lineWidth=2;c.beginPath();for(let i=0;i<=100;i++){const v=lo+w*nb*i/100,d=n*w*Math.exp(-(((v-m)/s)**2)/2)/(s*Math.sqrt(2*Math.PI));i?c.lineTo(X(v),Y(d)):c.moveTo(X(v),Y(d))}c.stroke();
  c.strokeStyle=INK;c.lineWidth=1;c.strokeRect(Lm,T,pw,ph);
  c.fillStyle=INK;c.font=F14;c.textAlign='center';c.fillText(t('aZres'),Lm+pw/2,H-12);c.save();c.translate(16,T+ph/2);c.rotate(-Math.PI/2);c.fillText(t('aFreq'),0,0);c.restore();
}
function hbar(id,W,labels,vals,o){
  const rh=32,Lm=210,Rm=56,T=40,B=48,H=T+B+labels.length*rh,c=mk(id,W,H),pw=W-Lm-Rm,X=v=>Lm+(v-o.min)/(o.max-o.min)*pw;
  c.font=F12;c.strokeStyle=GRID;c.fillStyle=MUTE;
  for(let i=0;i<=4;i++){const v=o.min+(o.max-o.min)*i/4;c.beginPath();c.moveTo(X(v),T);c.lineTo(X(v),T+labels.length*rh);c.stroke();c.textAlign='center';c.fillText(v.toFixed(2),X(v),T+labels.length*rh+16)}
  c.strokeStyle=INK;c.lineWidth=1.5;c.beginPath();c.moveTo(X(0),T);c.lineTo(X(0),T+labels.length*rh);c.stroke();c.lineWidth=1;
  labels.forEach((lb,i)=>{const y=T+i*rh,v=vals[i],ci=o.cis&&o.cis[i];
    c.fillStyle=o.sig[i]?ACC:GREY;c.fillRect(Math.min(X(0),X(v)),y+6,Math.abs(X(v)-X(0)),rh-12);
    let ext=v;if(ci){c.strokeStyle=INK;c.beginPath();c.moveTo(X(ci[0]),y+rh/2);c.lineTo(X(ci[1]),y+rh/2);c.moveTo(X(ci[0]),y+9);c.lineTo(X(ci[0]),y+rh-9);c.moveTo(X(ci[1]),y+9);c.lineTo(X(ci[1]),y+rh-9);c.stroke();ext=v>=0?Math.max(v,ci[1]):Math.min(v,ci[0])}
    c.fillStyle=INK;c.font=F12;c.textAlign=v>=0?'left':'right';c.fillText(fr(v),X(ext)+(v>=0?6:-6),y+rh/2+4);
    c.font=F14;c.textAlign='right';c.fillText(trim(c,lb,Lm-14),Lm-8,y+rh/2+5)});
  c.fillStyle=INK;c.font=F14;c.textAlign='center';c.fillText(o.xl,Lm+pw/2,H-10);
}
function splom(id,C,names,R,m='pearson'){
  const k=C.length,cs=k<=4?170:k<=6?130:100,M=10,W=M*2+k*cs,H=M*2+k*cs,c=mk(id,W,H),D=m=='pearson'?C:C.map(ranks),sy=SY[m][0];
  const rg=D.map(a=>{const lo=Math.min(...a),hi=Math.max(...a),p=(hi-lo)*.06||1;return[lo-p,hi+p]});
  for(let i=0;i<k;i++)for(let j=0;j<k;j++){
    const bx=M+j*cs+3,by=M+i*cs+3,bw=cs-6,bh=cs-6;
    c.strokeStyle=GRID;c.lineWidth=1;c.strokeRect(bx,by,bw,bh);
    if(i==j){const nb=Math.max(5,Math.ceil(Math.log2(C[i].length)+1)),{cnt}=bins(C[i],nb),mx=Math.max(...cnt);
      cnt.forEach((v,q)=>{const x=bx+q*bw/nb,hh=v/mx*(bh-30);c.fillStyle='rgba(13,107,92,.55)';c.fillRect(x,by+bh-hh,bw/nb-1,hh)});
      c.fillStyle=INK;c.font="700 12px Sarabun,sans-serif";c.textAlign='center';c.fillText(trim(c,names[i],bw-8),bx+bw/2,by+16)}
    else{const X=v=>bx+(v-rg[j][0])/(rg[j][1]-rg[j][0])*bw,Y=v=>by+bh-(v-rg[i][0])/(rg[i][1]-rg[i][0])*bh,r=R[i][j];
      c.fillStyle='rgba(192,57,43,.7)';D[j].forEach((v,q)=>{c.beginPath();c.arc(X(v),Y(D[i][q]),2.4,0,7);c.fill()});
      if(m!='kendall'){const rr=pearson(D[i],D[j]),sl=rr*sd(D[i])/sd(D[j]),ic=mean(D[i])-sl*mean(D[j]),x0=rg[j][0],x1=rg[j][1];
        c.save();c.beginPath();c.rect(bx,by,bw,bh);c.clip();c.strokeStyle=ACC;c.lineWidth=1.8;c.beginPath();c.moveTo(X(x0),Y(ic+sl*x0));c.lineTo(X(x1),Y(ic+sl*x1));c.stroke();c.restore()}
      c.fillStyle=INK;c.font="700 11px Sarabun,sans-serif";c.textAlign='left';c.fillText(sy+' = '+fr(r),bx+5,by+13)}
  }
}

/* ================= export ================= */
async function saveFile(name,blob){
  try{const d=await claude.use('downloads');
    if(d){await d.save({filename:name,data:blob});return toast(t('tSaved'))}}catch(e){if(e&&e.code=='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}
function saveXLSX(){
  if(!last)return;
  try{
    const wb=XLSX.utils.book_new();
    document.querySelectorAll('#out table.spss').forEach((tb,i)=>{
      const ws=XLSX.utils.table_to_sheet(tb);
      XLSX.utils.book_append_sheet(wb,ws,((i+1)+' '+(tb.dataset.title||'Sheet')).replace(/[\\\/?*\[\]:]/g,'').slice(0,31));
    });
    const eq=document.querySelector('#out .eq');
    if(eq)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(eq.innerText.split('\n').map(s=>[s.trim()]).filter(r=>r[0])),'Equations');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([last.names,...last.data]),'Data');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    saveFile('analysis-tables.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  }catch(e){toast(t('tFail'))}
}
async function saveDOC(){
  try{
    toast(t('tWait'));
    const cv=await html2canvas($('out'),{scale:2,backgroundColor:getComputedStyle(document.documentElement).getPropertyValue('--card').trim()||'#fff'});
    const{Document,Packer,Paragraph,ImageRun,TextRun}=docx,sliceH=Math.round(cv.width*1.32),kids=[new Paragraph({children:[new TextRun({text:hTitle(),bold:true,size:32})]})];
    for(let y=0;y<cv.height;y+=sliceH){const h=Math.min(sliceH,cv.height-y),s=document.createElement('canvas');s.width=cv.width;s.height=h;s.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      const bin=atob(s.toDataURL('image/png').split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      kids.push(new Paragraph({children:[new ImageRun({data:u,type:'png',transformation:{width:600,height:Math.round(600*h/cv.width)}})]}))}
    const doc=new Document({sections:[{properties:{page:{margin:{top:900,bottom:900,left:900,right:900}}},children:kids}]});
    saveFile('analysis-result.docx',await Packer.toBlob(doc));
  }catch(e){toast(t('tFail'))}
}

$('tbl').addEventListener('paste',e=>{
  const raw=(e.clipboardData||window.clipboardData).getData('text').replace(/\r/g,'').replace(/\n+$/,'');
  if(!/[\t\n]/.test(raw))return;
  e.preventDefault();
  const cell=e.target.closest('th,td'),c0=cell.cellIndex-1,r0=cell.parentElement.rowIndex-1;
  raw.split('\n').forEach((line,li)=>line.split('\t').forEach((v,ci)=>{
    const r=r0+li,c=c0+ci;
    while(c>=cols.length){cols.push('X'+(cols.length+1));rows.forEach(x=>x.push(''))}
    if(r<0){cols[c]=v.trim()||cols[c];return}
    while(rows.length<=r)rows.push(cols.map(()=>''));
    rows[r][c]=v.trim();
  }));
  render();toast(t('tPaste'));
});
